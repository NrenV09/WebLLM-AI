<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c20" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a0a0aa" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  
  <!-- Obsidian Glass Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="336" x2="416" y2="336" />
    <line x1="176" y1="96" x2="176" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="336" y1="96" x2="336" y2="416" />
  </g>
  
  <!-- Neural / WebGPU Core -->
  <rect x="156" y="156" width="200" height="200" rx="36" fill="#121216" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
  
  <!-- GPU Pins -->
  <g stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round">
    <line x1="196" y1="130" x2="196" y2="154" />
    <line x1="256" y1="130" x2="256" y2="154" />
    <line x1="316" y1="130" x2="316" y2="154" />
    
    <line x1="196" y1="358" x2="196" y2="382" />
    <line x1="256" y1="358" x2="256" y2="382" />
    <line x1="316" y1="358" x2="316" y2="382" />
    
    <line x1="130" y1="196" x2="154" y2="196" />
    <line x1="130" y1="256" x2="154" y2="256" />
    <line x1="130" y1="316" x2="154" y2="316" />
    
    <line x1="358" y1="196" x2="382" y2="196" />
    <line x1="358" y1="256" x2="382" y2="256" />
    <line x1="358" y1="316" x2="382" y2="316" />
  </g>

  <!-- Sparkle / Neural Core Icon -->
  <path d="M256 196 L265 240 L309 249 L265 258 L256 302 L247 258 L203 249 L247 240 Z" fill="url(#chipGrad)" />
  <circle cx="256" cy="316" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="316" cy="256" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="196" cy="256" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="196" r="3" fill="#ffffff" opacity="0.9" />
